services:
  postgres:
    image: postgres:16-alpine
    container_name: ojnotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: ojnotes_development
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco -d ojnotes_development"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
